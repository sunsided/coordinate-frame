---
name: Rust

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'crates/**src/**'
      - 'proc-macros/**/Cargo.toml'
      - 'proc-macros/**src/**'
      - '.codespellrc'
      - '.github/workflows/rust.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'crates/**src/**'
      - 'proc-macros/**/Cargo.toml'
      - 'proc-macros/**src/**'
      - '.codespellrc'
      - '.github/workflows/rust.yml'

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  codespell:
    name: Check for spelling mistakes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - name: Check format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  check-msrv:
    name: Check MSRV
    needs:
      - codespell
      - lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rust-version: [ 1.85.0, stable, nightly ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        env:
          TOOLCHAIN: ${{ matrix.rust-version }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
      - name: Install dependencies
        run: cargo fetch
      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features --verbose

  docs:
    name: Build documentation
    needs:
      - codespell
      - lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  build-linux:
    name: Build on Linux
    needs:
      - lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        features: [ "", "--all-features", "--no-default-features" ]
    env:
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clippy
        run: cargo clippy ${FEATURES:+"$FEATURES"} -- -D warnings
      - name: Build
        run: cargo build --verbose ${FEATURES:+"$FEATURES"}
      - name: Run doctests
        run: cargo test --doc --verbose ${FEATURES:+"$FEATURES"}
      - name: Run regular tests
        run: cargo test --tests --verbose ${FEATURES:+"$FEATURES"}
